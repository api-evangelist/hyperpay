aid: hyperpay
url: https://raw.githubusercontent.com/api-evangelist/hyperpay/refs/heads/main/apis.yml
name: HyperPay
kind: company
description: HyperPay is a MENA / Saudi Arabia online payment gateway built on the
  ACI / OPPWA Open Payment Platform. Its REST API powers the COPYandPAY hosted widget
  and a Server-to-Server integration, accepting cards (VISA, MASTER, AMEX), the Saudi
  domestic mada scheme, STC Pay, and Apple Pay, priced and settled in SAR. Additional
  products include HyperSplit (marketplace payouts) and HyperBill (invoicing).
